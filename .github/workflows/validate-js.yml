name: Validar JavaScript

on:
  push:
    branches: ["main", "feature/control-salud-backup-completo"]
  pull_request:
    branches: ["main"]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Comprobar sintaxis de JavaScript
        run: |
          find . -name '*.js' -not -path './.git/*' -print0 | xargs -0 -n1 node --check
